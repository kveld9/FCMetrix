<!doctype html>
<html lang="es" style="color-scheme: dark">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0f0d" />
    <title>Calculadora GRL — FC Mobile</title>
    <style>
        :root {
          --bg: #0b0f0d;
          --surface: #121715;
          --surface2: #1a1f1c;
          --line: #2a332e;
          --green: #2ee671;
          --green-glow: rgba(46, 230, 113, 0.3);
          --green-dim: #1a7d3f;
          --text: #eaf3ed;
          --text-secondary: #c8cfca;
          --text-dim: #9da8a2;
          --text-muted: #808b85;
          --danger: #e6472e;
          --danger-line: #3a1f1a;
          --gold: #d4a843;
          --gold-dim: #6b551f;
          --link: #2ee671; /* CAMBIO: color para enlaces */
          --radius-sm: 8px;
          --radius: 12px;
          --radius-lg: 16px;
          --font-mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        html {
          min-height: 100%;
          -webkit-tap-highlight-color: transparent;
        }

        body {
          background: var(--bg);
          color: var(--text);
          font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", sans-serif;
          /* CAMBIO: padding-top con safe-area y min-height con dvh */
          padding: max(16px, env(safe-area-inset-top)) 14px 70px;
          min-height: 100dvh;
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          display: flex;
          justify-content: center;
        }

        body.keyboard-open {
          padding-bottom: 55vh;
        }

        .wrap {
          max-width: 480px;
          width: 100%;
        }

        /* header */
        .header {
          text-align: center;
          margin-bottom: 20px; /* CAMBIO: un poco más de espacio */
        }
        .header .shield {
          width: 44px;
          height: 44px;
          margin: 0 auto 6px;
          background: radial-gradient(circle at 35% 35%, #2ee671 0%, #0f281a 80%);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1.4rem;
          box-shadow: 0 0 20px var(--green-glow);
        }
        .header h1 {
          font-size: 1.3rem;
          font-weight: 700;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: var(--text);
          margin: 0;
          line-height: 1.2;
        }
        .header .sub {
          font-size: 0.7rem;
          color: var(--text-dim);
          letter-spacing: 0.06em;
        }

        /* GRL card */
        .grl-card {
          background: var(--surface);
          border: 1px solid var(--line);
          border-radius: var(--radius-lg);
          padding: 20px 16px 16px;
          text-align: center;
          margin-bottom: 18px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .grl-card .label {
          font-size: 0.7rem;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          color: var(--text-secondary);
          margin-bottom: 2px;
        }
        .grl-card .grl-value {
          font-size: 4.5rem;
          font-weight: 800;
          color: var(--green);
          line-height: 1;
          letter-spacing: -0.02em;
          text-shadow:
            0 0 35px var(--green-glow),
            0 0 70px rgba(46, 230, 113, 0.15);
          margin: 2px 0 10px;
          font-family: var(--font-mono);
        }
        .grl-card .hint {
          font-size: 0.78rem;
          color: var(--text-secondary);
          line-height: 1.5;
        }
        .grl-card .hint strong {
          color: var(--green);
          font-weight: 600;
        }
        .state-incomplete {
          color: var(--text-dim);
          font-size: 0.85rem;
        }

        /* progress bar */
        .progress-wrap {
          margin-bottom: 14px;
        }
        .progress-header {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 5px;
        }
        .progress-header span:first-child {
          font-size: 0.8rem;
          font-weight: 600;
          color: var(--text);
          text-transform: uppercase;
          letter-spacing: 0.04em;
        }
        .progress-header span:last-child {
          font-size: 0.72rem;
          color: var(--text-secondary);
          font-weight: 500;
        }
        .progress-bar {
          height: 5px;
          background: var(--surface2);
          border-radius: 6px;
          overflow: hidden;
        }
        .progress-bar .fill {
          height: 100%;
          background: var(--green);
          border-radius: 6px;
          transition: width 0.25s ease;
          box-shadow: 0 0 10px var(--green-glow);
        }

        /* rango rápido */
        .quick-rango-label {
          font-size: 0.7rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: var(--text-dim);
          margin-bottom: 6px;
          padding-left: 4px;
        }
        .quick-rango {
          display: flex;
          gap: 6px;
          margin-bottom: 16px;
        }
        .rango-chip {
          flex: 1;
          background: var(--surface2);
          border: 1px solid var(--line);
          border-radius: 22px;
          padding: 10px 4px;
          font-size: 0.85rem;
          font-weight: 700;
          color: var(--text-secondary);
          cursor: pointer;
          text-align: center;
          transition: 0.15s;
          user-select: none;
          -webkit-user-select: none;
          letter-spacing: 0.03em;
        }
        .rango-chip:active {
          background: var(--green-dim);
          border-color: var(--green);
          color: #fff;
          box-shadow: 0 0 14px var(--green-glow);
        }

        /* secciones */
        .section-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin: 18px 0 6px;
        }
        .section-header h2 {
          font-size: 0.85rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: var(--text);
        }
        .badge {
          background: var(--surface2);
          padding: 2px 10px;
          border-radius: 20px;
          font-size: 0.7rem;
          color: var(--text-secondary);
          font-weight: 600;
        }

        /* lista de jugadores */
        .player-list {
          display: flex;
          flex-direction: column;
          gap: 5px;
          margin-bottom: 8px;
        }
        .player-row {
          display: flex;
          align-items: center;
          gap: 8px;
          background: var(--surface);
          border-radius: var(--radius);
          padding: 6px 10px;
          border: 1px solid transparent;
          transition: border 0.15s;
        }
        .player-row:focus-within {
          border-color: var(--green-dim);
        }
        .pos-num {
          width: 26px;
          text-align: center;
          font-weight: 700;
          font-size: 0.78rem;
          color: #e0e0e0;
          flex-shrink: 0;
        }
        .input-group {
          display: flex;
          flex-direction: column;
          gap: 1px;
          flex: 1;
          min-width: 0;
        }
        .input-group label {
          font-size: 0.62rem;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          color: var(--text-dim);
          padding-left: 3px;
        }
        .player-row input {
          width: 100%;
          background: var(--surface2);
          border: 1px solid var(--line);
          color: var(--text);
          border-radius: var(--radius-sm);
          padding: 8px 6px;
          font-size: 0.95rem;
          font-weight: 600;
          text-align: center;
          font-family: var(--font-mono);
          transition:
            border 0.15s,
            box-shadow 0.15s;
          -moz-appearance: textfield;
        }
        .player-row input::-webkit-outer-spin-button,
        .player-row input::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        .player-row input:focus {
          outline: none;
          border-color: var(--green);
          box-shadow: 0 0 12px var(--green-glow);
        }
        .rango-input {
          width: 54px;
          flex-shrink: 0;
          color: var(--gold) !important;
          border-color: var(--gold-dim) !important;
          letter-spacing: 0.04em;
        }
        .rango-input:focus {
          border-color: var(--gold) !important;
          box-shadow: 0 0 14px rgba(212, 168, 67, 0.25) !important;
        }
        .btn-remove {
          background: transparent;
          color: var(--danger);
          border: 1px solid var(--danger-line);
          border-radius: 50%;
          width: 28px;
          height: 28px;
          font-size: 0.9rem;
          font-weight: 700;
          cursor: pointer;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          transition: 0.12s;
        }
        .btn-remove:active {
          background: #2a1515;
          border-color: var(--danger);
        }

        /* estado vacío */
        .empty-sup {
          text-align: center;
          padding: 14px 10px;
          color: var(--text-dim);
          font-size: 0.78rem;
          border: 1px dashed var(--line);
          border-radius: var(--radius);
          background: var(--surface);
        }

        /* acciones */
        .actions {
          display: flex;
          gap: 10px;
          margin-top: 14px;
        }
        .btn {
          flex: 1;
          border: none;
          border-radius: var(--radius);
          padding: 13px 10px;
          font-size: 0.85rem;
          font-weight: 700;
          cursor: pointer;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          transition: 0.15s;
          text-align: center;
        }
        .btn-primary {
          background: var(--green);
          color: #021007;
          box-shadow: 0 4px 14px rgba(46, 230, 113, 0.2);
        }
        .btn-primary:active {
          background: var(--green-dim);
          box-shadow: none;
        }
        .btn-outline {
          background: transparent;
          border: 1px solid var(--danger-line);
          color: var(--danger);
          flex: 0.7;
          font-size: 0.8rem;
        }
        .btn-outline:active {
          background: #1a1212;
        }

        footer {
          text-align: center;
          color: var(--text-muted);
          font-size: 0.68rem;
          margin-top: 24px;
          letter-spacing: 0.03em;
          line-height: 1.6; /* CAMBIO: mejor espaciado */
        }

        /* CAMBIO: estilo para el enlace del footer */
        footer a {
          color: var(--link);
          text-decoration: underline;
          text-underline-offset: 2px;
          text-decoration-color: rgba(46, 230, 113, 0.3);
          transition: text-decoration-color 0.2s;
        }
        footer a:hover,
        footer a:active {
          text-decoration-color: var(--link);
        }

        @media (max-width: 380px) {
          .grl-card .grl-value {
            font-size: 3.8rem;
          }
          .player-row input {
            font-size: 0.85rem;
            padding: 7px 4px;
          }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="header">
        <div class="shield">⚽</div>
        <h1>Calculadora GRL</h1>
        <div class="sub">FC MOBILE · 2026</div>
    </div>

    <div class="grl-card">
        <div class="label">GRL Global</div>
        <div class="grl-value" id="grlGlobal">0</div>
        <div class="hint" id="nextInfo">
            <span class="state-incomplete">Cargá los 11 titulares</span>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress-header">
            <span>Titulares</span>
            <span id="titularesCount">0 / 11</span>
        </div>
        <div class="progress-bar">
            <div class="fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>

    <div class="quick-rango-label">Rango rápido</div>
    <div class="quick-rango" id="rangoQuick">
        <button class="rango-chip" data-rango="0">0</button>
        <button class="rango-chip" data-rango="1">1</button>
        <button class="rango-chip" data-rango="2">2</button>
        <button class="rango-chip" data-rango="3">3</button>
        <button class="rango-chip" data-rango="4">4</button>
        <button class="rango-chip" data-rango="5">5</button>
    </div>

    <div class="section-header">
        <h2>Jugadores titulares</h2>
        <span class="badge">11 fijos</span>
    </div>
    <div class="player-list" id="titularesBody"></div>

    <div class="section-header">
        <h2>Suplentes</h2>
        <span class="badge" id="supCount">0 / 7</span>
    </div>
    <div class="player-list" id="suplentesBody"></div>
    <div class="empty-sup" id="emptySupMsg">
        Todavía no agregaste suplentes.
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="addSup">+ Suplente</button>
        <button class="btn btn-outline" id="clearAll">Borrar todo</button>
    </div>

    <!-- CAMBIO: footer con enlace a GitHub -->
    <footer>
        Desarrollado con cariño por
        <a
                href="https://github.com/kveld9"
                target="_blank"
                rel="noopener noreferrer"
        >
            @kveld9 🐙
        </a>
    </footer>
</div>

<script>
    // (El script se mantiene exactamente igual, sin cambios)
    const TITULARES = 11;
    const MAX_SUPLENTES = 7;

    const titularesBody = document.getElementById("titularesBody");
    const suplentesBody = document.getElementById("suplentesBody");
    const emptySupMsg = document.getElementById("emptySupMsg");
    const supCount = document.getElementById("supCount");
    const titularesCount = document.getElementById("titularesCount");
    const progressFill = document.getElementById("progressFill");
    const grlGlobalEl = document.getElementById("grlGlobal");
    const nextInfoEl = document.getElementById("nextInfo");

    let suplentesData = [];

    function makeRow(index, isSup) {
      const div = document.createElement("div");
      div.className = "player-row";
      div.innerHTML = `
        <div class="pos-num">${isSup ? index + 12 : index + 1}</div>
        <div class="input-group">
          <label>GRL</label>
          <input type="number" min="47" max="150" value="" class="grl-input" data-idx="${index}" data-sup="${isSup ? 1 : 0}" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="input-group" style="max-width:62px;flex-shrink:1.4;">
          <label>Rango</label>
          <input type="number" min="0" max="5" value="0" class="rango-input" data-idx="${index}" data-sup="${isSup ? 1 : 0}" inputmode="numeric" pattern="[0-9]*">
        </div>
        ${isSup ? `<button class="btn-remove" data-remove="${index}" aria-label="Quitar suplente">×</button>` : ""}
      `;
      return div;
    }

    for (let i = 0; i < TITULARES; i++) {
      titularesBody.appendChild(makeRow(i, false));
    }

    function renderSuplentes() {
      suplentesBody.innerHTML = "";
      suplentesData.forEach((_, i) =>
        suplentesBody.appendChild(makeRow(i, true)),
      );
      emptySupMsg.style.display = suplentesData.length ? "none" : "block";
      supCount.textContent = `${suplentesData.length} / ${MAX_SUPLENTES}`;
      bindInputs();
      calcular();
    }

    renderSuplentes();

    document.getElementById("addSup").addEventListener("click", () => {
      if (suplentesData.length >= MAX_SUPLENTES) return;
      suplentesData.push({ grl: 0, rango: 0 });
      renderSuplentes();
    });

    document.getElementById("rangoQuick").addEventListener("click", (e) => {
      const chip = e.target.closest(".rango-chip");
      if (!chip) return;
      setAllRangos(parseInt(chip.dataset.rango));
    });

    function setAllRangos(val) {
      document
        .querySelectorAll(".rango-input")
        .forEach((inp) => (inp.value = String(val)));
      calcular();
    }

    document.getElementById("clearAll").addEventListener("click", () => {
      suplentesData = [];
      document.querySelectorAll("#titularesBody input").forEach((inp) => {
        inp.value = inp.classList.contains("rango-input") ? "0" : "";
      });
      renderSuplentes();
    });

    suplentesBody.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-remove");
      if (!btn) return;
      suplentesData.splice(parseInt(btn.dataset.remove), 1);
      renderSuplentes();
    });

    function clampInput(inp) {
      if (inp.value === "") return;
      let v = parseFloat(inp.value);
      if (isNaN(v)) return;
      const min = parseFloat(inp.min);
      const max = parseFloat(inp.max);
      if (v < min) v = min;
      if (v > max) v = max;
      inp.value = String(Math.round(v));
    }

    function bindInputs() {
      document.querySelectorAll("input").forEach((inp) => {
        inp.oninput = calcular;
        inp.onblur = () => {
          clampInput(inp);
          calcular();
        };
        inp.onfocus = () => {
          setTimeout(() => {
            updateKeyboardState();
            scrollFocusedIntoView(inp);
          }, 250);
          setTimeout(() => {
            updateKeyboardState();
            scrollFocusedIntoView(inp, false);
          }, 600);
        };
      });
    }
    bindInputs();

    function scrollFocusedIntoView(inp, smooth = true) {
      if (!inp || inp.tagName !== "INPUT") return;
      const vv = window.visualViewport;
      const viewportTop = vv ? vv.offsetTop : 0;
      const viewportBottom = vv
        ? vv.offsetTop + vv.height
        : window.innerHeight;
      const margin = 24;
      inp.scrollIntoView({
        behavior: smooth ? "smooth" : "auto",
        block: "center",
        inline: "nearest",
      });
      requestAnimationFrame(() => {
        const r = inp.getBoundingClientRect();
        if (r.bottom > viewportBottom - margin)
          window.scrollBy({
            top: r.bottom - viewportBottom + margin,
            behavior: smooth ? "smooth" : "auto",
          });
        else if (r.top < viewportTop + margin)
          window.scrollBy({
            top: r.top - viewportTop - margin,
            behavior: smooth ? "smooth" : "auto",
          });
      });
    }

    function updateKeyboardState() {
      const vv = window.visualViewport;
      if (!vv) return;
      const open = window.innerHeight - vv.height > 120;
      document.body.classList.toggle("keyboard-open", open);
      if (open && document.activeElement?.tagName === "INPUT") {
        requestAnimationFrame(() =>
          requestAnimationFrame(() =>
            scrollFocusedIntoView(document.activeElement, false),
          ),
        );
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateKeyboardState);
      window.visualViewport.addEventListener("scroll", updateKeyboardState);
    }
    window.addEventListener("resize", updateKeyboardState);

    function readSection(bodyEl, count) {
      const arr = [];
      for (let i = 0; i < count; i++) {
        const grlInp = bodyEl.querySelector(`.grl-input[data-idx="${i}"]`);
        const rangoInp = bodyEl.querySelector(
          `.rango-input[data-idx="${i}"]`,
        );
        arr.push({
          grl: isNaN(parseFloat(grlInp?.value))
            ? null
            : parseFloat(grlInp.value),
          rango: parseFloat(rangoInp?.value) || 0,
        });
      }
      return arr;
    }

    function calcular() {
      const titulares = readSection(titularesBody, TITULARES);
      const suplentes = readSection(suplentesBody, suplentesData.length);
      const titCargados = titulares.filter((j) => j.grl !== null).length;
      titularesCount.textContent = `${titCargados} / ${TITULARES}`;
      progressFill.style.width = `${(titCargados / TITULARES) * 100}%`;

      const todos = [...titulares, ...suplentes];
      if (todos.filter((j) => j.grl !== null).length < TITULARES) {
        grlGlobalEl.textContent = "—";
        nextInfoEl.innerHTML = `<span class="state-incomplete">Faltan ${TITULARES - titCargados} titular${TITULARES - titCargados === 1 ? "" : "es"}</span>`;
        return;
      }

      const n = TITULARES + suplentes.filter((j) => j.grl !== null).length;
      const usados = todos.filter((j) => j.grl !== null);
      const sumaBase = usados.reduce((acc, j) => acc + (j.grl - j.rango), 0);
      const sumaRango = usados.reduce((acc, j) => acc + j.rango, 0);
      grlGlobalEl.textContent =
        Math.ceil(sumaBase / n) + Math.ceil(sumaRango / n);

      function puntosParaSubir(suma, den) {
        if (den === 11) {
          const frac = (suma / 11) % 1.0;
          const i8 = Math.floor(frac * 10);
          return i8 === 0 ? 1 : 11 - i8;
        } else {
          const rem = ((suma % den) + den) % den;
          return rem === 0 ? 1 : den - rem + 1;
        }
      }

      const pGRL = puntosParaSubir(sumaBase, n);
      const pRango = puntosParaSubir(sumaRango, n);

      const allRangoMax = usados.every((j) => j.rango === 5);

      if (allRangoMax) {
        nextInfoEl.innerHTML = `
          <div>Faltan <strong>${pGRL}</strong> pt${pGRL === 1 ? "o" : "s"} de GRL para subir</div>
          <div>✅ Rango máximo alcanzado</div>
        `;
      } else {
        nextInfoEl.innerHTML = `
          <div>Faltan <strong>${pGRL}</strong> pt${pGRL === 1 ? "o" : "s"} de GRL para subir</div>
          <div>Faltan <strong>${pRango}</strong> pt${pRango === 1 ? "o" : "s"} de Rango para subir</div>
        `;
      }
    }

    calcular();
</script>
</body>
</html>
