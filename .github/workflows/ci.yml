name: FCMetrix CI/CD Quality-Left Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Harness Synchronization (Drift Check)
        run: |
          ./gradlew syncHarness
          git diff --exit-code AGENTS.md || (echo "Harness is out of sync with dependencies! Run ./gradlew syncHarness before committing." && exit 1)

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug
