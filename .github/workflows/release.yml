name: FCMetrix Automated Release Gate & Publisher
run-name: 🚀 Release ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build, Verify, Checksum & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase (Full History & Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify Harness Synchronization (Drift Check)
        run: |
          ./gradlew syncHarness
          git diff --exit-code AGENTS.md || (echo "Harness out of sync! Run ./gradlew syncHarness before tagging." && exit 1)

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Assemble Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Sign & Prepare Artifacts
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          STAGE="artifacts"
          mkdir -p "$STAGE"

          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"
          TARGET_RELEASE_APK="${STAGE}/FCMetrix-${TAG_NAME}.apk"
          TARGET_DEBUG_APK="${STAGE}/FCMetrix-${TAG_NAME}-debug.apk"

          RAW_RELEASE_APK=$(find $RELEASE_DIR -name "*.apk" | head -n 1)
          RAW_DEBUG_APK=$(find $DEBUG_DIR -name "*.apk" | head -n 1)

          if [ -z "$RAW_RELEASE_APK" ]; then
            echo "ERROR: No se encontró ningún APK en $RELEASE_DIR"
            exit 1
          fi

          # Sign Release APK
          if [ -n "$SIGNING_KEY" ]; then
            echo "Firmando APK de producción con Keystore oficial..."
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$TARGET_RELEASE_APK" "$RAW_RELEASE_APK"
            rm -f keystore.jks
          else
            echo "AVISO: Firmando Release APK con debug key para asegurar instalabilidad..."
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks ~/.android/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$TARGET_RELEASE_APK" "$RAW_RELEASE_APK"
          fi

          # Copy Debug APK if available
          if [ -n "$RAW_DEBUG_APK" ] && [ -f "$RAW_DEBUG_APK" ]; then
            cp "$RAW_DEBUG_APK" "$TARGET_DEBUG_APK"
          fi

      - name: Generate Multi-Hash Checksums
        run: |
          TAG_NAME="${{ github.ref_name }}"
          STAGE="artifacts"
          cd "$STAGE"

          CHECKSUM_FILE="checksums-${TAG_NAME}.txt"

          echo "==================================================" > "$CHECKSUM_FILE"
          echo " FCMetrix ${TAG_NAME} — Integrity Hashes" >> "$CHECKSUM_FILE"
          echo "==================================================" >> "$CHECKSUM_FILE"
          echo "" >> "$CHECKSUM_FILE"

          echo "## SHA-256" >> "$CHECKSUM_FILE"
          sha256sum FCMetrix-*.apk >> "$CHECKSUM_FILE"
          echo "" >> "$CHECKSUM_FILE"

          echo "## SHA-512" >> "$CHECKSUM_FILE"
          sha512sum FCMetrix-*.apk >> "$CHECKSUM_FILE"
          echo "" >> "$CHECKSUM_FILE"

          echo "## MD5" >> "$CHECKSUM_FILE"
          md5sum FCMetrix-*.apk >> "$CHECKSUM_FILE"

          # Standard SHA-256 verification files
          sha256sum FCMetrix-*.apk > SHA256SUMS.txt
          cd ..

      - name: Generate Detailed Changelog & Release Notes
        id: changelog
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "## 📥 Downloads / Descargas" > release_notes.md
          echo "" >> release_notes.md
          echo "| Archivo / File | Descripción / Description |" >> release_notes.md
          echo "| :--- | :--- |" >> release_notes.md
          echo "| \`FCMetrix-${TAG_NAME}.apk\` | 🚀 **Producción** (Optimizado y Minificado con R8 / ProGuard) |" >> release_notes.md
          echo "| \`FCMetrix-${TAG_NAME}-debug.apk\` | 🧪 **Debug** (Build de Desarrollo y Testing) |" >> release_notes.md
          echo "| \`checksums-${TAG_NAME}.txt\` | 🔒 Hashes de Integridad (SHA-256, SHA-512, MD5) |" >> release_notes.md
          echo "| \`SHA256SUMS.txt\` | 🛡️ Checksums estándar para verificación (\`sha256sum -c\`) |" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 📦 Changelog" >> release_notes.md
          echo "" >> release_notes.md

          if [ -z "$PREV_TAG" ]; then
            echo "**Primer release o sin tags previos detectados.** Lista completa de commits:" >> release_notes.md
            git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          else
            echo "Cambios introducidos desde **$PREV_TAG** hasta **${TAG_NAME}**:" >> release_notes.md
            echo "" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - @%an" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FCMetrix ${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: false
          files: artifacts/*
          fail_on_unmatched_files: true
